<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>Delivery Agent Portal - RALPHMART SUPERCENTER</title>
  <link rel="stylesheet" href="styles.css?v=21.0">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="taxonomy.js?v=5.0"></script>
  <script src="supabase-client.js?v=8.0"></script>
  <style>
    :root {
      --agent-primary: #512175;
      --agent-primary-hover: #3e1859;
      --agent-dark: #091e3a;
      --agent-bg: #f8fafc;
      --agent-card: #ffffff;
      --agent-border: #e2e8f0;
      --agent-text: #0f172a;
      --agent-muted: #64748b;
      --agent-green: #15803d;
      --agent-amber: #b45309;
      --agent-red: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--agent-bg);
      color: var(--agent-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Strict Rule: Absolutely nothing goes up or jumps when hovered */
    a, button, .card, .btn, .rider-order-card, .agent-card, input, select {
      transform: none !important;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease !important;
    }
    a:hover, button:hover, .card:hover, .btn:hover {
      transform: none !important;
    }

    /* Header */
    .agent-header {
      background: var(--agent-dark);
      border-bottom: 3px solid var(--agent-primary);
      color: #ffffff;
      padding: 14px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .agent-header-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .agent-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #ffffff;
    }

    .agent-brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--agent-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .agent-brand-title {
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .agent-brand-sub {
      font-size: 11px;
      color: #94a3b8;
      display: block;
    }

    .agent-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .agent-status-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .agent-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
    }

    .agent-btn-logout {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .agent-btn-logout:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Main Container */
    .agent-main-container {
      max-width: 1080px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px 50px;
      flex: 1;
    }

    /* Authentication Screen */
    .agent-auth-wrapper {
      max-width: 540px;
      margin: 24px auto;
      background: #ffffff;
      border: 1px solid var(--agent-border);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      overflow: hidden;
    }

    .agent-auth-nav {
      display: flex;
      border-bottom: 1px solid var(--agent-border);
      background: #f8fafc;
    }

    .agent-auth-nav-btn {
      flex: 1;
      padding: 14px 16px;
      border: none;
      background: transparent;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--agent-muted);
      cursor: pointer;
      text-align: center;
      border-bottom: 2px solid transparent;
    }

    .agent-auth-nav-btn.active {
      color: var(--agent-primary);
      background: #ffffff;
      border-bottom: 2px solid var(--agent-primary);
    }

    .agent-auth-body {
      padding: 24px;
    }

    /* Forms */
    .form-row {
      margin-bottom: 14px;
    }

    .form-row-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    @media (max-width: 600px) {
      .form-row-grid-2 {
        grid-template-columns: 1fr;
        gap: 14px;
      }
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 5px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--agent-border);
      border-radius: 8px;
      font-size: 13.5px;
      color: #0f172a;
      background: #ffffff;
      outline: none;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--agent-primary);
    }

    /* Password field with eye toggle */
    .password-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-field-wrapper .form-input {
      padding-right: 42px;
    }

    .eye-toggle-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%) !important;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #64748b;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .eye-toggle-btn:hover {
      color: var(--agent-primary);
    }

    .btn-submit-primary {
      width: 100%;
      padding: 12px 18px;
      background: var(--agent-primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-submit-primary:hover {
      background: var(--agent-primary-hover);
    }

    /* Notices */
    .agent-notice-box {
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .agent-notice-box.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }
    .agent-notice-box.warning {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }
    .agent-notice-box.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    /* Dashboard Navigation Tabs */
    .agent-dashboard-tabs {
      display: flex;
      background: #ffffff;
      border: 1px solid var(--agent-border);
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
      overflow-x: auto;
    }

    .dash-tab-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--agent-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .dash-tab-btn.active {
      background: var(--agent-primary);
      color: #ffffff;
    }

    .dash-tab-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 10px;
    }

    .dash-tab-btn:not(.active) .dash-tab-count {
      background: #e2e8f0;
      color: #475569;
    }

    /* Order Cards */
    .agent-order-card {
      background: #ffffff;
      border: 1px solid var(--agent-border);
      border-radius: 12px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .agent-card-header {
      background: #f8fafc;
      padding: 12px 18px;
      border-bottom: 1px solid var(--agent-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .agent-card-title {
      font-size: 14.5px;
      font-weight: 900;
      color: var(--agent-primary);
    }

    .agent-card-body {
      padding: 18px;
    }

    .order-details-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .order-details-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .order-info-block {
      background: #f8fafc;
      border: 1px solid var(--agent-border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      line-height: 1.5;
    }

    .order-info-title {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .contact-action-btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-call {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .btn-wa {
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    /* Price Quoting Box inside Card */
    .agent-quote-action-box {
      background: #faf5ff;
      border: 1.5px solid #d8b4fe;
      border-radius: 10px;
      padding: 16px;
      margin-top: 14px;
    }

    .agent-quote-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--agent-primary);
      margin-bottom: 10px;
    }

    .quote-inputs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    @media (max-width: 600px) {
      .quote-inputs-grid {
        grid-template-columns: 1fr;
      }
    }

    .btn-submit-quote {
      background: var(--agent-primary);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-submit-quote:hover {
      background: var(--agent-primary-hover);
    }

    /* Delivery Progress Action Buttons */
    .delivery-action-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--agent-border);
    }

    .btn-step {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-step-pickup {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1.5px solid #bfdbfe;
    }

    .btn-step-transit {
      background: #091e3a;
      color: #ffffff;
    }

    .btn-step-delivered {
      background: var(--agent-green);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- TOP APP BAR -->
  <header class="agent-header">
    <div class="agent-header-inner">
      <a href="delivery.html" class="agent-brand">
        <div class="agent-brand-logo">RM</div>
        <div>
          <span class="agent-brand-title">RALPHMART LOGISTICS</span>
          <span class="agent-brand-sub" id="headerAgentSub">Delivery Agent Portal</span>
        </div>
      </a>
      <div class="agent-header-right" id="agentHeaderRight" style="display: none;">
        <div class="agent-status-badge">
          <span class="agent-status-dot"></span>
          <span>Verified Agent</span>
        </div>
        <button type="button" class="agent-btn-logout" onclick="window.handleAgentLogout()">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="agent-main-container">

    <!-- AUTHENTICATION CONTAINER (REGISTER / LOGIN) -->
    <div class="agent-auth-wrapper" id="agentAuthWrapper">
      <nav class="agent-auth-nav">
        <button type="button" class="agent-auth-nav-btn active" id="btnTabLogin" onclick="window.switchAuthTab('login')">
          Agent Login
        </button>
        <button type="button" class="agent-auth-nav-btn" id="btnTabRegister" onclick="window.switchAuthTab('register')">
          Register New Agent
        </button>
      </nav>

      <!-- LOGIN FORM -->
      <div class="agent-auth-body" id="authLoginPane">
        <div id="loginFeedback"></div>

        <form id="agentLoginForm" onsubmit="window.handleAgentLogin(event)">
          <div class="form-row">
            <label class="form-label" for="loginEmailOrPhone">Email Address or Phone Number *</label>
            <input type="text" id="loginEmailOrPhone" class="form-input" required placeholder="e.g. name@example.com or 08012345678">
          </div>

          <div class="form-row">
            <label class="form-label" for="loginPassword">Password *</label>
            <div class="password-field-wrapper">
              <input type="password" id="loginPassword" class="form-input" required placeholder="Enter your password">
              <button type="button" class="eye-toggle-btn" onclick="window.togglePasswordVisibility('loginPassword', this)" aria-label="Toggle password view" title="Show/Hide Password">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit-primary" style="margin-top: 10px;">
            Sign In to Agent Portal
          </button>
        </form>
      </div>

      <!-- REGISTRATION FORM -->
      <div class="agent-auth-body" id="authRegisterPane" style="display: none;">
        <div class="agent-notice-box info">
          <strong>Delivery Agent Application:</strong> After registration, store administrators will review and approve your account before you can log in and quote delivery prices.
        </div>

        <div id="registerFeedback"></div>

        <form id="agentRegisterForm" onsubmit="window.handleAgentRegister(event)">
          <div class="form-row-grid-2">
            <div>
              <label class="form-label" for="regFirstName">First Name *</label>
              <input type="text" id="regFirstName" class="form-input" required placeholder="e.g. Samuel">
            </div>
            <div>
              <label class="form-label" for="regLastName">Last Name *</label>
              <input type="text" id="regLastName" class="form-input" required placeholder="e.g. Okon">
            </div>
          </div>

          <div class="form-row-grid-2">
            <div>
              <label class="form-label" for="regPhone">Phone Number *</label>
              <input type="tel" id="regPhone" class="form-input" required placeholder="e.g. 08012345678">
            </div>
            <div>
              <label class="form-label" for="regEmail">Email Address *</label>
              <input type="email" id="regEmail" class="form-input" required placeholder="e.g. samuel@example.com">
            </div>
          </div>

          <div class="form-row-grid-2">
            <div>
              <label class="form-label" for="regState">Operating State *</label>
              <select id="regState" class="form-select" required onchange="window.populateRegLgas(this.value)">
                <option value="" disabled selected>Select State</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="regLga">Local Government Area (LGA) *</label>
              <select id="regLga" class="form-select" required disabled>
                <option value="" disabled selected>Select State first</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label" for="regAddress">Residential / Dispatch Base Address *</label>
            <input type="text" id="regAddress" class="form-input" required placeholder="e.g. 14 Ikot Ekpene Road, Uyo">
          </div>

          <div class="form-row-grid-2">
            <div>
              <label class="form-label" for="regPassword">Password *</label>
              <div class="password-field-wrapper">
                <input type="password" id="regPassword" class="form-input" required minlength="6" placeholder="At least 6 characters">
                <button type="button" class="eye-toggle-btn" onclick="window.togglePasswordVisibility('regPassword', this)" aria-label="Toggle password view" title="Show/Hide Password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
            <div>
              <label class="form-label" for="regPasswordRetype">Retype Password *</label>
              <div class="password-field-wrapper">
                <input type="password" id="regPasswordRetype" class="form-input" required minlength="6" placeholder="Confirm password">
                <button type="button" class="eye-toggle-btn" onclick="window.togglePasswordVisibility('regPasswordRetype', this)" aria-label="Toggle password view" title="Show/Hide Password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
              </div>
            </div>
          </div>

          <button type="submit" class="btn-submit-primary" style="margin-top: 8px;" id="regSubmitBtn">
            Submit Registration for Admin Approval
          </button>
        </form>
      </div>
    </div>

    <!-- DASHBOARD VIEW (APPROVED AGENTS ONLY) -->
    <div id="agentDashboardView" style="display: none;">
      <!-- Navigation Tabs -->
      <div class="agent-dashboard-tabs">
        <button type="button" class="dash-tab-btn active" id="tabBtnQuotes" onclick="window.switchDashTab('quotes')">
          <span>Quote Price Needed</span>
          <span class="dash-tab-count" id="countPendingQuotes">0</span>
        </button>
        <button type="button" class="dash-tab-btn" id="tabBtnActive" onclick="window.switchDashTab('active')">
          <span>Active Dispatches</span>
          <span class="dash-tab-count" id="countActiveDispatches">0</span>
        </button>
        <button type="button" class="dash-tab-btn" id="tabBtnHistory" onclick="window.switchDashTab('history')">
          <span>Completed</span>
          <span class="dash-tab-count" id="countHistory">0</span>
        </button>
      </div>

      <!-- Feed Container -->
      <div id="agentOrdersFeed"></div>
    </div>

  </main>

  <script>
    // State
    let currentAgent = null;
    let activeDashTab = 'quotes';
    let assignedOrders = [];

    document.addEventListener('DOMContentLoaded', () => {
      initStatesDropdown();
      checkActiveAgentSession();

      window.addEventListener('nkemmart_order_updated', () => {
        if (currentAgent) loadAgentOrders();
      });
    });

    // Populate Nigeria States
    function initStatesDropdown() {
      const stateSelect = document.getElementById('regState');
      if (!stateSelect) return;
      const locations = window.NIGERIA_LOCATIONS || {};
      const keys = Object.keys(locations).sort((a, b) => (locations[a].name || a).localeCompare(locations[b].name || b));

      keys.forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = locations[k].name || k;
        stateSelect.appendChild(opt);
      });
    }

    window.populateRegLgas = function(stateKey) {
      const lgaSelect = document.getElementById('regLga');
      if (!lgaSelect) return;
      const locations = window.NIGERIA_LOCATIONS || {};
      const stateObj = locations[stateKey];

      if (!stateObj || !Array.isArray(stateObj.lgas)) {
        lgaSelect.innerHTML = '<option value="" disabled selected>No LGAs available</option>';
        lgaSelect.disabled = true;
        return;
      }

      lgaSelect.disabled = false;
      lgaSelect.innerHTML = '<option value="" disabled selected>Select LGA</option>';
      const sorted = [...stateObj.lgas].sort((a, b) => a.localeCompare(b));
      sorted.forEach(lga => {
        const opt = document.createElement('option');
        opt.value = lga;
        opt.textContent = lga;
        lgaSelect.appendChild(opt);
      });
    };

    // Eye toggle for password inputs
    window.togglePasswordVisibility = function(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';

      // Switch SVG icon
      if (isPass) {
        // Eye off icon
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
      } else {
        // Normal eye icon
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      }
    };

    // Switch between Login and Register tabs
    window.switchAuthTab = function(tab) {
      const loginPane = document.getElementById('authLoginPane');
      const registerPane = document.getElementById('authRegisterPane');
      const btnLogin = document.getElementById('btnTabLogin');
      const btnRegister = document.getElementById('btnTabRegister');

      if (tab === 'register') {
        loginPane.style.display = 'none';
        registerPane.style.display = 'block';
        btnLogin.classList.remove('active');
        btnRegister.classList.add('active');
      } else {
        loginPane.style.display = 'block';
        registerPane.style.display = 'none';
        btnRegister.classList.remove('active');
        btnLogin.classList.add('active');
      }
    };

    // Check active session
    function checkActiveAgentSession() {
      try {
        const stored = JSON.parse(localStorage.getItem('nkemmart_active_agent') || 'null');
        if (stored && stored.id && stored.status === 'approved') {
          currentAgent = stored;
          showDashboardView();
        }
      } catch (e) {}
    }

    // Handle Agent Registration
    window.handleAgentRegister = async function(e) {
      e.preventDefault();
      const fb = document.getElementById('registerFeedback');
      fb.innerHTML = '';

      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const email = document.getElementById('regEmail').value.trim().toLowerCase();
      const stateKey = document.getElementById('regState').value;
      const lga = document.getElementById('regLga').value;
      const address = document.getElementById('regAddress').value.trim();
      const password = document.getElementById('regPassword').value;
      const passwordRetype = document.getElementById('regPasswordRetype').value;

      if (password !== passwordRetype) {
        fb.innerHTML = '<div class="agent-notice-box warning">Passwords do not match. Please retype carefully.</div>';
        return;
      }

      const locations = window.NIGERIA_LOCATIONS || {};
      const stateName = (locations[stateKey] && locations[stateKey].name) || stateKey;

      const submitBtn = document.getElementById('regSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting Application...';

      try {
        if (typeof registerDeliveryAgent === 'function') {
          await registerDeliveryAgent({
            first_name: firstName,
            last_name: lastName,
            phone: phone,
            email: email,
            state: stateName,
            lga: lga,
            address: address,
            password: password
          });
        }

        fb.innerHTML = `
          <div class="agent-notice-box success">
            <strong>Registration Submitted Successfully:</strong> Your application for ${firstName} ${lastName} (${phone}) is pending administrator approval. Once an administrator approves your account in the Store Control Panel, you will be able to log in.
          </div>
        `;
        document.getElementById('agentRegisterForm').reset();
      } catch (err) {
        fb.innerHTML = `<div class="agent-notice-box warning">${escapeHtml(err.message)}</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Registration for Admin Approval';
      }
    };

    // Handle Agent Login
    window.handleAgentLogin = async function(e) {
      e.preventDefault();
      const fb = document.getElementById('loginFeedback');
      fb.innerHTML = '';

      const id = document.getElementById('loginEmailOrPhone').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      try {
        if (typeof loginDeliveryAgent !== 'function') throw new Error('System initialization error.');
        const agent = await loginDeliveryAgent(id, pass);

        currentAgent = agent;
        localStorage.setItem('nkemmart_active_agent', JSON.stringify(agent));
        showDashboardView();
      } catch (err) {
        fb.innerHTML = `<div class="agent-notice-box warning">${escapeHtml(err.message)}</div>`;
      }
    };

    window.handleAgentLogout = function() {
      localStorage.removeItem('nkemmart_active_agent');
      currentAgent = null;
      document.getElementById('agentAuthWrapper').style.display = 'block';
      document.getElementById('agentDashboardView').style.display = 'none';
      document.getElementById('agentHeaderRight').style.display = 'none';
      document.getElementById('headerAgentSub').textContent = 'Delivery Agent Portal';
    };

    function showDashboardView() {
      document.getElementById('agentAuthWrapper').style.display = 'none';
      document.getElementById('agentDashboardView').style.display = 'block';
      document.getElementById('agentHeaderRight').style.display = 'flex';
      document.getElementById('headerAgentSub').textContent = `${currentAgent.full_name} (${currentAgent.state || 'Nigeria'})`;

      loadAgentOrders();
    }

    // Load orders assigned to this agent
    async function loadAgentOrders() {
      if (!currentAgent) return;
      let allOrders = [];

      // 1. Supabase
      const client = getSupabase();
      if (client) {
        try {
          const { data, error } = await client.from('orders').select('*').order('created_at', { ascending: false });
          if (!error && Array.isArray(data)) allOrders = data;
        } catch (e) {}
      }

      // 2. Local storage
      ['nkemmart_user_orders', 'nkemmart_orders'].forEach(k => {
        try {
          const loc = JSON.parse(localStorage.getItem(k) || '[]');
          loc.forEach(lo => {
            if (!lo || !lo.id) return;
            const ex = allOrders.find(o => String(o.id) === String(lo.id));
            if (!ex) allOrders.push(lo);
          });
        } catch (e) {}
      });

      // Filter orders assigned to this agent
      assignedOrders = allOrders.filter(o =>
        String(o.assigned_agent_id) === String(currentAgent.id) ||
        (o.assigned_agent_phone && o.assigned_agent_phone === currentAgent.phone)
      );

      renderDashboardKPIs();
      renderAgentOrdersFeed();
    }

    function renderDashboardKPIs() {
      const quoteNeeded = assignedOrders.filter(o =>
        o.order_status === 'assigned_to_agent' || o.quote_status === 'awaiting_agent_quote'
      );
      const active = assignedOrders.filter(o =>
        o.order_status === 'confirmed' || o.order_status === 'processing' || o.order_status === 'shipped' || o.delivery_substatus === 'picked_up'
      );
      const history = assignedOrders.filter(o => o.order_status === 'delivered');

      document.getElementById('countPendingQuotes').textContent = quoteNeeded.length;
      document.getElementById('countActiveDispatches').textContent = active.length;
      document.getElementById('countHistory').textContent = history.length;
    }

    window.switchDashTab = function(tab) {
      activeDashTab = tab;
      document.querySelectorAll('.dash-tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'quotes') document.getElementById('tabBtnQuotes').classList.add('active');
      else if (tab === 'active') document.getElementById('tabBtnActive').classList.add('active');
      else if (tab === 'history') document.getElementById('tabBtnHistory').classList.add('active');

      renderAgentOrdersFeed();
    };

    function renderAgentOrdersFeed() {
      const feed = document.getElementById('agentOrdersFeed');
      if (!feed) return;

      let list = [];
      if (activeDashTab === 'quotes') {
        list = assignedOrders.filter(o =>
          o.order_status === 'assigned_to_agent' || o.quote_status === 'awaiting_agent_quote' || o.order_status === 'agent_quoted'
        );
      } else if (activeDashTab === 'active') {
        list = assignedOrders.filter(o =>
          o.order_status === 'confirmed' || o.order_status === 'processing' || o.order_status === 'shipped' || o.delivery_substatus === 'picked_up'
        );
      } else if (activeDashTab === 'history') {
        list = assignedOrders.filter(o => o.order_status === 'delivered');
      }

      if (list.length === 0) {
        feed.innerHTML = `
          <div style="background: #ffffff; border: 1px solid var(--agent-border); border-radius: 12px; padding: 48px 20px; text-align: center; color: #64748b;">
            <h4 style="font-size: 16px; color: #091e3a; margin-bottom: 4px;">No orders in this queue</h4>
            <p style="font-size: 12.5px;">Orders assigned to you by store administrators will appear here.</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = list.map(o => {
        const dest = `${o.delivery_address || ''}, ${o.city || ''}, ${o.state || ''}`;
        const phone = o.customer_phone || o.phone || '';
        const waUrl = `https://wa.me/234${phone.replace(/^0/, '')}?text=${encodeURIComponent('Hello ' + (o.customer_name || 'Customer') + ', this is ' + currentAgent.full_name + ' regarding your RALPHMART order #' + o.id + '.')}`;
        const isPrepaid = (o.payment_method === 'card_online' || o.payment_status === 'paid');
        const isQuoteNeeded = (o.order_status === 'assigned_to_agent' || o.quote_status === 'awaiting_agent_quote');
        const isQuoteSubmitted = (o.order_status === 'agent_quoted');

        let itemsSummary = 'General store items';
        if (Array.isArray(o.items) && o.items.length > 0) {
          itemsSummary = o.items.map(it => `${it.qty || 1}x ${it.title}${it.variant_name ? ' (' + it.variant_name + ')' : ''}`).join(', ');
        }

        return `
          <div class="agent-order-card" id="agent-order-${escapeHtml(o.id)}">
            <div class="agent-card-header">
              <div>
                <span class="agent-card-title">Order #${escapeHtml(o.id)}</span>
                <span style="font-size: 11.5px; color: #64748b; margin-left: 6px;">Placed: ${o.created_at ? new Date(o.created_at).toLocaleDateString('en-GB') : 'Recent'}</span>
              </div>
              <span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: #faf5ff; color: #512175; border: 1px solid #d8b4fe; text-transform: uppercase;">
                ${escapeHtml((o.delivery_substatus || o.order_status || 'Assigned').replace(/_/g, ' '))}
              </span>
            </div>

            <div class="agent-card-body">
              <div class="order-details-grid">
                <!-- Delivery Destination -->
                <div class="order-info-block">
                  <div class="order-info-title">Delivery Destination</div>
                  <strong style="color: #0f172a; font-size: 14px;">${escapeHtml(dest)}</strong>
                  <div style="font-size: 12px; color: #64748b; margin-top: 4px;">Items: ${escapeHtml(itemsSummary)}</div>
                </div>

                <!-- Recipient Contact -->
                <div class="order-info-block">
                  <div class="order-info-title">Recipient Customer</div>
                  <strong style="color: #0f172a; font-size: 14px;">${escapeHtml(o.customer_name || 'Customer')}</strong>
                  <div style="font-size: 12px; color: #475569;">Phone: ${escapeHtml(phone || 'Not provided')}</div>
                  <div style="display: flex; gap: 8px; align-items: center;">
                    ${phone ? `<a href="tel:${escapeHtml(phone)}" class="contact-action-btn btn-call">Call Customer</a>` : ''}
                    ${phone ? `<a href="${waUrl}" target="_blank" rel="noopener noreferrer" class="contact-action-btn btn-wa">WhatsApp</a>` : ''}
                  </div>
                </div>
              </div>

              <!-- Payment details -->
              <div style="background: #f8fafc; border: 1px solid var(--agent-border); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px;">
                <span style="font-size: 12.5px; font-weight: 700; color: ${isPrepaid ? '#15803d' : '#b45309'};">
                  ${isPrepaid ? 'Payment: Prepaid Online via Paystack' : 'Payment: Pay on Delivery (Collect on Arrival)'}
                </span>
                <span style="font-size: 14px; font-weight: 800; color: #091e3a;">Total: ${formatNaira(o.total_amount)}</span>
              </div>

              <!-- QUOTE INPUT SECTION (If price quote needed) -->
              ${isQuoteNeeded ? `
                <div class="agent-quote-action-box">
                  <div class="agent-quote-title">Enter Your Delivery Price Quote for this Destination</div>
                  <div class="quote-inputs-grid">
                    <div>
                      <label class="form-label" for="quote-price-${escapeHtml(o.id)}">Your Delivery Price (&#8358;) *</label>
                      <input type="number" id="quote-price-${escapeHtml(o.id)}" class="form-input" placeholder="e.g. 2500" min="0" required>
                    </div>
                    <div>
                      <label class="form-label" for="quote-eta-${escapeHtml(o.id)}">Delivery Timeframe</label>
                      <input type="text" id="quote-eta-${escapeHtml(o.id)}" class="form-input" placeholder="e.g. Within 24 Hours">
                    </div>
                  </div>
                  <div style="margin-bottom: 10px;">
                    <label class="form-label" for="quote-notes-${escapeHtml(o.id)}">Delivery Notes (Optional)</label>
                    <input type="text" id="quote-notes-${escapeHtml(o.id)}" class="form-input" placeholder="e.g. Road accessibility note, vehicle requirement">
                  </div>
                  <button type="button" class="btn-submit-quote" onclick="window.handleAgentSubmitQuote('${escapeHtml(o.id)}')">
                    Submit Price Quote to Store Admin
                  </button>
                </div>
              ` : ''}

              <!-- AWAITING ADMIN APPROVAL BADGE -->
              ${isQuoteSubmitted ? `
                <div class="agent-notice-box info" style="margin-top: 12px; margin-bottom: 0;">
                  <strong>Price Quote Submitted:</strong> You quoted <strong>${formatNaira(o.agent_quoted_fee || o.delivery_fee)}</strong>. Waiting for store administrator to approve and notify customer.
                </div>
              ` : ''}

              <!-- DISPATCH FULFILLMENT BUTTONS (When approved & confirmed) -->
              ${(o.order_status === 'confirmed' || o.order_status === 'processing' || o.order_status === 'shipped') ? `
                <div class="delivery-action-strip">
                  ${o.delivery_substatus !== 'picked_up' && o.order_status !== 'shipped' ? `
                    <button type="button" class="btn-step btn-step-pickup" onclick="window.advanceDeliveryStep('${escapeHtml(o.id)}', 'picked_up')">
                      Confirm Pickup from Supercenter
                    </button>
                  ` : ''}
                  ${o.order_status !== 'shipped' ? `
                    <button type="button" class="btn-step btn-step-transit" onclick="window.advanceDeliveryStep('${escapeHtml(o.id)}', 'shipped')">
                      Out for Delivery
                    </button>
                  ` : ''}
                  <button type="button" class="btn-step btn-step-delivered" onclick="window.advanceDeliveryStep('${escapeHtml(o.id)}', 'delivered')">
                    Mark as Delivered
                  </button>
                </div>
              ` : ''}

              ${o.order_status === 'delivered' ? `
                <div style="text-align: center; color: #15803d; font-weight: 800; font-size: 13px; margin-top: 10px;">
                  Delivered Successfully
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    // Agent submits price quote for assigned order
    window.handleAgentSubmitQuote = async function(orderId) {
      const priceInput = document.getElementById('quote-price-' + orderId);
      const etaInput = document.getElementById('quote-eta-' + orderId);
      const notesInput = document.getElementById('quote-notes-' + orderId);

      const price = Number(priceInput ? priceInput.value : 0);
      if (price <= 0) {
        alert('Please enter a valid delivery price quote in Naira.');
        if (priceInput) priceInput.focus();
        return;
      }

      const eta = etaInput ? etaInput.value.trim() : 'Within 24 Hours';
      const notes = notesInput ? notesInput.value.trim() : '';

      try {
        if (typeof submitAgentPriceQuote === 'function') {
          await submitAgentPriceQuote(orderId, currentAgent.id, price, eta, notes);
        }
        alert('Your delivery price quote of ' + formatNaira(price) + ' has been submitted to Admin for approval!');
        loadAgentOrders();
      } catch (err) {
        alert('Could not submit price quote: ' + err.message);
      }
    };

    // Agent updates fulfillment status
    window.advanceDeliveryStep = async function(orderId, nextStatus) {
      const labels = {
        picked_up: 'Package Picked Up from Store',
        shipped: 'Out for Delivery',
        delivered: 'Delivered'
      };
      if (!confirm(`Update order #${orderId} status to "${labels[nextStatus] || nextStatus}"?`)) return;

      try {
        if (typeof updateAgentDeliveryStatus === 'function') {
          await updateAgentDeliveryStatus(orderId, currentAgent.id, nextStatus);
        }
        alert(`Order #${orderId} updated to ${labels[nextStatus] || nextStatus}!`);
        loadAgentOrders();
      } catch (err) {
        alert('Could not update status: ' + err.message);
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
